          id="uniprot-test-id"
          [(ngModel)]="uniprot_id"
          name="uniprot_id"
          required
          placeholder="View PDBe-KB pages based on PDB ID or UniProt accession..."
          type="search"
        />

      <div class="columns large-2 medium-2 small-2">
        <button type="submit" id="search-button" class="vf-search__button | vf-button vf-button--secondary">
          <span class="hide-for-small-only vf-button__text">Explore</span
          ><svg
            aria-hidden="true"
            xmlns="http://www.w3.org/2000/svg"
            version="1.1"
            xmlns:xlink="http://www.w3.org/1999/xlink"
            xmlns:svgjs="http://svgjs.com/svgjs"
            viewBox="0 0 140 140"
            width="16"
            height="16"
            class="show-for-small-only vf-icon vf-icon--search-btn | vf-button__icon"
          >
            <g transform="matrix(5.833333333333333,0,0,5.833333333333333,0,0)">
              <path
                d="M23.414,20.591l-4.645-4.645a10.256,10.256,0,1,0-2.828,2.829l4.645,4.644a2.025,2.025,0,0,0,2.828,0A2,2,0,0,0,23.414,20.591ZM10.25,3.005A7.25,7.25,0,1,1,3,10.255,7.258,7.258,0,0,1,10.25,3.005Z"
                fill="#3B6FB6"
                stroke="none"
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="0"
              ></path>
            </g>
          </svg>
        </button>
      </div>
    </form>
    <div style="color: #ffff; margin-left: 15px">
      <p>
        Examples:
        <a
          href="https://www.ebi.ac.uk/pdbe/pdbe-kb/proteins/Q14676"
          class="search-ex-link"
          onclick="gtag('event', 'form_submit', {'event_category': 'search', 'event_label': 'example_search', 'value': undefined})"
          >Q14676</a
        >
        <a
          href="https://www.ebi.ac.uk/pdbe/pdbe-kb/proteins/2etx"
          class="search-ex-link"
          onclick="gtag('event', 'form_submit', {'event_category': 'search', 'event_label': 'example_search', 'value': undefined})"
          >2etx</a
        >
        <span style="font-size: smaller">Type in a PDB identifier or UniProt accession to view the corresponding PDBe-KB page.</span>
      </p>
    </div>
