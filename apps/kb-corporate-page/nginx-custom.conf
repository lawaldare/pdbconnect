# Expires map
map $sent_http_content_type $expires {
    default                    off;
    text/html                  epoch;
    text/css                   max;
    application/json           max;
    application/javascript     max;
    ~image/                    max;
}

log_format custom_log '$remote_addr - $remote_user [$time_local] "$request" $status $bytes_sent "$http_referer" "$http_user_agent" "$http_x_forwarded_for"';

upstream angular_ssr {
    server localhost:4000;  # Your Express server
}

server {
    listen 80;
    root /usr/share/nginx/html;
    access_log syslog:server=127.0.0.1:5531,facility=local7,tag=nginx,severity=info custom_log;

    # Remove the root location handler that proxies everything
    # We'll handle specific paths instead

    # Health check endpoint - bypass SSR
    location /health {
        proxy_pass http://angular_ssr/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Main application location
    location /pdbe/pdbe-kb/ {
        # Try static files first (CSS, JS, images, etc.)
        # If not found, proxy to SSR server
        alias /usr/share/nginx/html/;
        try_files $uri @ssr_proxy;

        expires $expires;
        gzip on;
        gzip_types text/plain application/javascript application/x-javascript text/xml text/css;
    }

    # Proxy to Angular SSR server for dynamic routes
    location @ssr_proxy {
        proxy_pass http://angular_ssr/pdbe/pdbe-kb/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_redirect off;

        # Important: Preserve the original URL
        proxy_set_header X-Original-URI $request_uri;
    }

    # Handle redirects properly
    proxy_redirect / /pdbe/pdbe-kb/;

    expires $expires;
    gzip on;
    gzip_types text/plain application/javascript application/x-javascript text/xml text/css;
}