
# Expires map
map $sent_http_content_type $expires {
    default                    off;
    text/html                  epoch;
    text/css                   max;
    application/json           max;
    application/javascript     max;
    ~image/                    max;
}

log_format custom_log '$remote_addr - $remote_user [$time_local] "$request" $status $bytes_sent "$http_referer" "$http_user_agent" "$http_x_forwarded_for"';

server {
  listen 80;
  access_log syslog:server=127.0.0.1:5531,facility=local7,tag=nginx,severity=info custom_log;

  # Angular SSR app
    location ^~ /pdbe/pdbe-kb {
    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;

    # Standard Proxy Headers
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;

    # Real IP Headers (Crucial for EBI logging)
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /pdbe/pdbe-kb;

    proxy_redirect off;
}

  location / {
      root /usr/share/nginx/html;
      index index.html index.htm;
      try_files $uri $uri/ /index.html =404;
    }
  expires $expires;
  gzip  on;
  gzip_types  text/plain application/javascript application/x-javascript text/xml text/css;
}
