map $sent_http_content_type $expires {
    default                    off;
    text/html                  epoch;
    text/css                   1h;
    application/json           1h;
    application/javascript     1h;
    ~image/                    1h;
}

upstream angular_ssr {
    server localhost:4000;
}

server {
    listen 80;
    root /usr/share/nginx/html;

    # Health check
    location /health {
        proxy_pass http://angular_ssr/health;
    }

    # Serve static Angular files
    location /pdbe/pdbe-kb/ {
        alias /usr/share/nginx/html/pdbe/pdbe-kb/;
        try_files $uri $uri/ @ssr_proxy;

        expires $expires;
        gzip on;
        gzip_types text/plain application/javascript application/x-javascript text/xml text/css;
    }

    # SSR fallback
    location @ssr_proxy {
        proxy_pass http://angular_ssr;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
