<section class="root-container">
  <nav>
    @for(navItem of navItems; track navItem.url){
    <a [routerLink]="navItem.url" routerLinkActive="active">
      <i class="icon {{ navItem.icon }}"></i>
      <span>{{ navItem.label }}</span>
    </a>
    }
  </nav>
  <main>
    <h1 class="heading-1">{{ entryId() }}</h1>
    <section class="hero">
      @if (pageData$ | async; as pageData) {
      <pdbe-entry-information [information]="pageData"></pdbe-entry-information>
      }
      <pdbe-entry-ligands-environments></pdbe-entry-ligands-environments>
    </section>
    <pdbe-entry-macromolecules [molecules]="molecules"></pdbe-entry-macromolecules>
    <section class="footer">
      <pdbe-entry-experiment-validation></pdbe-entry-experiment-validation>
      <pdbe-entry-citation></pdbe-entry-citation>
    </section>

    <!-- @if (pageData$ | async; as pageData) {
    <pdbe-entry-information [information]="pageData"></pdbe-entry-information>
    } -->
    <!-- Container for 3D concept -->
    <!-- <section id="struct-3d-container" class="page-section">
      <app-struc-explorer-ecm-2024></app-struc-explorer-ecm-2024>
    </section> -->
  </main>
</section>
