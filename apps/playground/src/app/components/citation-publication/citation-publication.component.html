<h4>
  Most {{ headerText }} displayed. &nbsp;
  <a [href]="'https://europepmc.org/search?query=(ACCESSION_TYPE:pdb)' + entryId"
    >View all in Europe PMC <img src="assets/icons/open-new-tab.svg" target="_blank" class="icon"
  /></a>

<ol class="articles">
  @for(article of publicationInfo.slice(0,5); track article.pubmed_id){

  }
</ol>
