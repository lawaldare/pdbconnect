<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>PDBe Connect Pages</title>
    <base href="/" />
    <meta name="HandheldFriendly" content="true" />
    <meta name="MobileOptimized" content="width" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Favicons -->
    <link rel="icon" type="image/png" sizes="16x16" href="assets/icons/pdbe-logo/pdbe-icon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/pdbe-logo/pdbe-icon-32x32.png" />
    <link rel="shortcut icon" href="assets/icons/pdbe-logo/pdbe-icon-32x32.png" />

    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/pdbe-logo/pdbe-icon-180x180.png" />

    <!-- Android / Chrome -->
    <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/pdbe-logo/pdbe-icon-192x192.png" />

    <!-- Safari pinned tab -->
    <link rel="mask-icon" href="assets/icons/pdbe-logo/pdbe-icon-monochrome-mask.svg" color="#74B360" />

    <!-- MS Icons -->
    <meta name="msapplication-TileColor" content="#74B360" />
    <meta name="msapplication-TileImage" content="assets/icons/pdbe-logo/pdbe-icon-144x144.png" />

    <!-- IBM Plex Sans font added -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />

    <!-- Google font -->
    <link href="https://fonts.googleapis.com/css?family=Montserrat:400,700,900" rel="stylesheet" />

    <script>
      // This will override __webpack_public_path__ at runtime
      const hostname = window.location.hostname;
      window.__app_public_path__ = hostname === 'localhost' ? '/' : '/pdbe/connect/';
    </script>
  </head>

  <body>
    <pdbc-root> </pdbc-root>

    <script>
      PdbeAutocompleteSearchConfig = {
        resultBoxAlign: 'right',
        redirectOnClick: true,
        view: 'macromolecules', //'entry' | 'macromolecules' | 'compounds' | 'sequencefam';
        searchUrl: 'https://www.ebi.ac.uk/pdbe/search/pdb-autocomplete/select',
        fields: 'value,num_pdb_entries,var_name',
        group: 'group=true&group.field=category',
        groupLimit: '25',
        sort: 'category+asc,num_pdb_entries+desc',
        searchParams: 'rows=20000&json.nl=map&wt=json',
      };
    </script>

    <!-- JS -->
    <!-- <script type="text/javascript" src="https://molstar.org/pdbe-molstar/build/pdbe-molstar-plugin.js" defer></script> -->
  </body>
</html>
