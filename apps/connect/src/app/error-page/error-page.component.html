@if(asPage()){
<pdbc-pdbe-header-logo-menu [headerConfig]="headerLogoMenuConfig" />
}

<section class="container">
  <div id="notfound">
    <h1>Oops!</h1>
    <h2>{{statusCode()}} - {{error().title}}</h2>
    <p>{{error().message}}</p>
    @if(statusCode() > 500){
    <p>Go to <a href="https://www.ebi.ac.uk/about/contact/support/pdbe" target="_blank">support</a></p>
    }
  </div>
</section>
