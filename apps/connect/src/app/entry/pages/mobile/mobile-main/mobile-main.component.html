@if(pageView() === 'SUCCESS'){
<section class="mobile-tabs-content">
  @if(activePage() === mbTabNames.Overview){
  <pdbc-mb-overview-tab />
  } @if(activePage() === mbTabNames.Molstar){
  <pdbc-mb-molstar-tab />
  } @if(activePage() === mbTabNames.Citation){
  <pdbc-mb-citation-tab />
  } @if(activePage() === mbTabNames.OtherResources){
  <pdbc-mb-other-resources-tab />
  }
</section>
}@else if (pageView() === 'LOADING') {
<section class="entry-page-container">
  <ngx-skeleton-loader count="1" [theme]="{ 'border-radius': '0', height: '400px' }"></ngx-skeleton-loader>
</section>
} @else if(pageView() === 'ERROR') {
<pdbc-error-page [asPage]="false" />
}
