<!-- Overview Molstar: selection dropdown and zoom controls -->
<div class="molstar-control-bar">
  @if (currentMolstarSelection()) {
  <div>
    <div class="selector">
      <span class="molstar-control-txt">Select:</span>
      <span class="molstar-control-txt-info">
        <pdbc-entry-dropdown
          [downloadable]="false"
          [islink]="false"
          [isdark]="true"
          [issmall]="true"
          [options]="selectionOptions"
          [title]="selectedItem"
          (optionClickedEvent)="onMolstarSelect($event)"
        >
        </pdbc-entry-dropdown>
      </span>
    </div>
