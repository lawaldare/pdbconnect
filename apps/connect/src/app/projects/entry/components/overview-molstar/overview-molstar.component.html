<section class="top-structure-section">
  <!-- Overview Tab Nav: Assembly, Macromolecules, Ligands, Domains, Modifications tabs -->
  <pdbc-overview-tab-nav></pdbc-overview-tab-nav>
  <section class="tab-content">
    <section class="molstar-controls">
      <!-- Overview Molstar: selection dropdown and zoom controls, shown only when a listview item is selected -->
      <pdbc-overview-molstar-control-bar></pdbc-overview-molstar-control-bar>
      <!-- Container of molstar instance -->
      <section class="molstar-container" #molstarContainer></section>
    </section>
    <section class="info-controls" #infoControls>
      <!-- listview items and information rendering based on selected tab in Overview Tab Nav -->
      <pdbc-overview-tab-listview></pdbc-overview-tab-listview>
    </section>
  </section>
</section>
