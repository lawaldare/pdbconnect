<!-- tab-nav-menu.component.html -->
<nav class="tab-nav">
  @for(tab of tabsConfig(); track tab) {
  <div
    class="tab-container"
    [ngClass]="{ active: currentTab() === tab.id, inactive: tabsStates()[tab.id].isInactive }"
    (click)="stateManagement.switchCurrentTab(tab.id)"
  >
    <button class="tab-button">
      <div class="tab-tag" [ngClass]="tab.tagClass">{{ tab.tagContent }}</div>
      {{ tab.id }}
    </button>
  </div>
  <div class="vertical-line"></div>
  }
</nav>
