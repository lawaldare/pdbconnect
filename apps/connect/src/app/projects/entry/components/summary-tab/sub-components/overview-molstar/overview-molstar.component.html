<section class="top-structure-section">
  <section class="tab-content">
    <section class="molstar-controls">
      @if (!isOverviewSectionDisplayed()) {
      <div class="loader">
        <ngx-skeleton-loader count="1" [theme]="{ 'border-radius': '0', height: '400px' }"></ngx-skeleton-loader>
      </div>
      }
      <pdbc-overview-molstar-control-bar></pdbc-overview-molstar-control-bar>
      @if (!molstarFirstRenderFinished()) {
      <ngx-skeleton-loader count="1" [theme]="{ 'border-radius': '0', height: '480px', width: '480px' }"></ngx-skeleton-loader>
      }
      <!-- <div class="toolbar">
        <mat-icon aria-hidden="false" aria-label="Example home icon" fontIcon="outbox" (click)="popupMolstar()"></mat-icon>
      </div> -->
      <section
        id="overview-molstar-container"
        class="molstar-container"
        [ngStyle]="{ visibility: molstarFirstRenderFinished() ? '' : 'hidden', height: molstarFirstRenderFinished() ? '480px' : 'unset' }"
        #molstarContainer
      ></section>
    </section>
    <section class="info-controls" #infoControls>
      @if (isOverviewSectionDisplayed()) {
      <pdbc-overview-tab-listview></pdbc-overview-tab-listview>
      } @else {
      <div class="loader">
        <ngx-skeleton-loader count="1" [theme]="{ 'border-radius': '0', height: '400px' }"></ngx-skeleton-loader>
      </div>
      }
    </section>
  </section>
</section>
