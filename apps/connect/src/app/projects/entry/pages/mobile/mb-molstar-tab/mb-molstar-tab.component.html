<main>
  <nav>
    <img src="/assets/images/mobile/blue-arrow-left.svg" alt="arrow left" />
    <span (click)="goBackToOverviewPage()">Back to entry overview </span>
  </nav>
  <h1>3D view - {{entryId()}}</h1>

  <section class="chips">
    @for(chip of mobileTabChips; track chip.id){
    <span class="chip" #chipEl [attr.data-id]="chip.id" [class.active]="chip.id === selectedTabName()" (click)="onTabClick(chip)">{{chip.label}}</span>
    }
  </section>

  <div class="container-3d">
    <!-- <div class="molstar-parent" id="parent-molstar-container">
      <div class="molstar-container" #molstarContainer id="molstar-mobile-element"></div>
    </div> -->
    @if (configForMolstar()) {
    <div class="molstar-parent">
      <lib-pdbe-molstar class="molstar-container" #molstarComponent [id]="'mobile-molstar'" [molstarConfig]="configForMolstar()" [height]="'100%'"></lib-pdbe-molstar>
    </div>
    }
  </div>
</main>
