@if(rowData().length){
<div id="structures-section">
  <header>
    <p class="title"><strong>{{rowData().length}} assemblies representing this complex in the PDB</strong></p>
    <button class="vf-button vf-button--link" (click)="downloadCSV()">
      Download structures (csv)
      <i class="icon icon-common icon-download"></i>
    </button>
    <button class="vf-button vf-button--link" (click)="downloadMMCIF()">
      Download coordinates (mmCIF)
      <i class="icon icon-common icon-download"></i>
    </button>
  </header>
  <section>
    <div class="table">
      <ag-grid-angular
        class="ag-theme-quartz"
        [rowData]="rowData()"
        [columnDefs]="colDefs"
        [gridOptions]="gridOptions"
        (selectionChanged)="onSelectionChanged($event)"
        [paginationPageSizeSelector]="paginationPageSizeSelector()"
        [rowSelection]="rowSelection"
        [initialState]="initialState"
      />
    </div>
    <div class="molstar">
      <div style="padding: 20px 10px">
        <p><strong>View assembly in 3D</strong></p>
        <p>Click on any table row to visualise the individual assembly. By default, the first assembly in the table is shown.</p>
      </div>
      <div #popoutWrapper>
        <lib-pdbe-molstar [molstarConfig]="config" [height]="height"></lib-pdbe-molstar>
      </div>
    </div>
  </section>
</div>

} @else {
<h4>No structures data available yet!</h4>
}
