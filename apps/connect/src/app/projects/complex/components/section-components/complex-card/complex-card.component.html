<div class="card-container">
  <div class="image-box">
    @if(complexImageSrc()){
    <img [src]="complexImageSrc()" alt="Complex Image" />
    }@else {
    <ngx-skeleton-loader count="4" [theme]="{ 'border-radius': '0', height: '128px', width: '148px' }"></ngx-skeleton-loader>
    }
  </div>
  <article>
    <a
      matTooltipClass="complex-name-tooltip"
      [matTooltip]="complexInteraction().name"
      matTooltipPosition="above"
      (click)="openComplexPage(complexInteraction().pdb_complex_id)"
    >
      {{ complexInteraction().pdb_complex_id }}
      <i class="icon icon-link icon-common"></i>
    </a>
    <p class="participant">
      @for(participant of complexInteraction().common_participants; track participant){
      <span>{{ participant.accession }} ({{ participant.stoichiometry }}), </span>
      }
    </p>
  </article>
</div>
