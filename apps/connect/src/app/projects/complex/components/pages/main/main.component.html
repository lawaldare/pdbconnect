<pdbc-pdbe-header-logo-menu [headerConfig]="headerLogoMenuConfig" />
<pdbc-pdbe-header-search [headerSearchConfig]="headerSearchConfig" />

<main>
  <div class="container">
    <pdbc-pdbe-nav-menu [highlightColor]="'#B6D0CF'" [navSections]="navSections" />
    @if(loaded() === status.SUCCESS){
    <article>
      <section class="hero">
        @if(summaryData()?.name){
        <h2 libTruncateText [truncateText]="summaryData()?.name ?? ''" [limit]="30"></h2>
        } @else {
        {{ complexId() }}
        } @if(complexId()){
        <h4>{{ complexId() }}</h4>
        }
      </section>
      <section class="summary">
        <pdbc-summary />
      </section>
      <section class="structures">
        <pdbc-complex-structures />
      </section>
      <section class="ligands">
        <pdbc-complex-ligands />
      </section>
      <section class="interactions">
        <pdbc-complex-interactions />
      </section>
      <section class="publication">
        <pdbc-complex-publications />
      </section>
    </article>
    } @else if(loaded() === status.LOADING) {
    <div class="loader">
      <ngx-skeleton-loader count="1" [theme]="{ 'border-radius': '0', height: '50px', width: '450px' }"></ngx-skeleton-loader>
      <ngx-skeleton-loader count="1" [theme]="{ 'border-radius': '0', height: '50px', width: '100px' }"></ngx-skeleton-loader>
      <ngx-skeleton-loader count="4" [theme]="{ 'border-radius': '0', height: '450px' }"></ngx-skeleton-loader>
    </div>
    }
  </div>
</main>
