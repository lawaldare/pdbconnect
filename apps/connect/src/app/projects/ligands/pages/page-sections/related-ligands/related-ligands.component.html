<!-- @if(relatedLigand$ | async; as relatedLigand) { -->
<div class="related-ligands-container">
  <div class="header">
    <span class="heading-2"> Related ligands</span>
  </div>
  @if(sameScaffolds.length > 0){
  <div class="scaffold-container">
    <div class="scaffold-header">
      <span class="heading-3">Same scaffold - {{ sameScaffolds.length }}</span>
    </div>
    <div class="gallery-container">
      <form class="search-container">
        <input type="search" placeholder="Search for scaffold by name, code or PDB ID" class="form_input" name="search" />
        <img src="{{ searchLogo }}" />
      </form>
      <div class="grid-container"></div>
    </div>
  </div>
  } @if(similarLigands.length){
  <div class="scaffold-container">
    <div class="scaffold-header">
      <span class="heading-3">Similar ligands - {{ similarLigands.length }}</span>
    </div>
    <div class="gallery-container">
      <form class="search-container">
        <input type="search" placeholder="Search for ligand by name, code or PDB ID" class="form_input" name="search" />
        <img src="{{ searchLogo }}" />
      </form>
      <div class="grid-container">
        @for (similarLigand of similarLigandsPage; track similarLigand) {
        <pdbc-ligand-grid [ligand]="similarLigand"></pdbc-ligand-grid>
        }
      </div>
      <mat-paginator
        [length]="100"
        [pageSize]="pageSize"
        [pageSizeOptions]="pageSizeOptions"
        (page)="handlePageEvent($event)"
        showFirstLastButtons
        aria-label="Select page of ligands"
      >
      </mat-paginator>
    </div>
  </div>
  }
</div>
<!-- } -->
