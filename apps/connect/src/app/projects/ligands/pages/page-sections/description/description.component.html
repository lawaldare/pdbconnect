<div id="description-section" class="description-info">
  <span id="description-title" class="heading-2">Description</span>
  <div class="description-info-rows">
    <div class="description-info-rows">
      <div class="info-row">
        <span class="info-row-title">Synonyms</span>
        <span class="info-row-content">
          <span> {{ synonyms }}</span>
        </span>
      </div>
      <div class="info-row">
        <span class="info-row-title">Formula</span>
        <span class="info-row-content">
          <span id="formula-box" class="info-row-line">{{ formula }}</span>
        </span>
      </div>
      <div class="info-row">
        <span class="info-row-title">IUPAC InChI</span>
        <span class="info-row-content">
          <span> {{ inchi }}</span>
        </span>
      </div>
      <div class="info-row">
        <span class="info-row-title">IUPAC InChIKey</span>
        <span class="info-row-content">
          <span> {{ inchikey }}</span>
        </span>
      </div>
      <div class="info-row">
        <span class="info-row-title">SMILES</span>
        <span class="info-row-content">
          <span> {{ smiles }}</span>
        </span>
      </div>
    </div>
  </div>
</div>
