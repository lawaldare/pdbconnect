<div id="description-section">
  <h3 class="title">Description</h3>
  <div class="info-row">
    <span class="info-row-title">Synonyms</span>
    <div class="info-row-content">
      {{ description().synonyms }}
    </div>
  </div>
  <div class="info-row formula-row">
    <span class="info-row-title">Formula</span>
    <article>
      <div class="info-row-content formula">
        {{ description().formula }}
      </div>
      <i class="icon icon-common icon-clone" (click)="copy(description().formula)"></i>
    </article>
  </div>
  <div class="info-row">
    <span class="info-row-title">IUPAC InChI</span>
    <article>
      <div class="info-row-content" libTruncateText [truncateText]="description().inchi" [limit]="120"></div>
      <i class="icon icon-common icon-clone" (click)="copy(description().inchi)"></i>
    </article>
  </div>
  <div class="info-row">
    <span class="info-row-title">IUPAC InChIKey</span>
    <article>
      <div class="info-row-content">
        {{ description().inchikey }}
      </div>
      <i class="icon icon-common icon-clone" (click)="copy(description().inchikey)"></i>
    </article>
  </div>
  <div class="info-row">
    <span class="info-row-title">SMILES</span>
    <article>
      <div class="info-row-content">
        {{ description().smiles[0].name }}
      </div>
      <i class="icon icon-common icon-clone" (click)="copy(description().smiles[0].name)"></i>
    </article>
  </div>
  <div class="info-row source-row">
    <span class="info-row-title"></span>
    <div class="info-row-content">
      Source <a href="https://www.eyesopen.com/" target="_blank">OpenEye <i class="icon icon-link icon-common"></i></a>
    </div>
  </div>
  <div class="action-buttons">
    <button class="vf-button vf-button--primary vf-button--sm" (click)="openAtomsDialog()">View Atoms</button>
    <button class="vf-button vf-button--primary vf-button--sm" (click)="openBondsDialog()">View Bonds</button>
  </div>
</div>
