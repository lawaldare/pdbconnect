<pdbc-pdbe-header-logo-menu [headerConfig]="headerLogoMenuConfig"></pdbc-pdbe-header-logo-menu>
<pdbc-pdbe-header-search [headerSearchConfig]="headerSearchConfig"></pdbc-pdbe-header-search>

<main>
  <div class="container">
    <pdbc-pdbe-nav-menu [highlightColor]="'#B6D0CF'" [navSections]="navSections"></pdbc-pdbe-nav-menu>
    @if(description){
    <div>
      <section class="hero">
        <h2 class="id">{{ ligandId }}</h2>
        <h4 class="name">{{ description.name }}</h4>
        @for(annotation of description.annotations; track annotation.name){
        <pdbc-pdbe-chips [label]="annotation.name | titlecase" [url]="annotation.url" backgroundColor="#F9CF3B" fontColor="#1A1C1A"></pdbc-pdbe-chips>
        }
        <div class="action-buttons" [ngClass]="expandedDropdowns() ? 'expanded' : ''">
          <button class="vf-button vf-button--primary vf-button--sm">View 3D</button>
          <div class="drop-down">
            <pdbc-pdbe-dropdown #dDropdown dropdownText="Download as" [options]="downloadOptions" elementId="dare"></pdbc-pdbe-dropdown>
          </div>
        </div>
      </section>
      <section class="description">
        <pdbc-description [description]="description"></pdbc-description>
        <pdbc-image-carousel [ligandId]="ligandId"></pdbc-image-carousel>
      </section>
    </div>
    }
