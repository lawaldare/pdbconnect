<section>
  <header>
    <i class="icon icon-common icon-window-close" (click)="dialogRef.close()"></i>
  </header>
  <table mat-table [dataSource]="dataSource" id="structure-table">
    <!-- Position Column -->
    <ng-container matColumnDef="pdb_id">
      <th mat-header-cell *matHeaderCellDef>PDB ID</th>
      <td mat-cell *matCellDef="let item">
        <a [href]="'https://www.ebi.ac.uk/pdbe/entry/pdb/' + item.pdb_id" target="_blank">
          {{ item.pdb_id || '-' }}
          @if(item.pdb_id){
          <i class="icon icon-link icon-common"></i>
          }
        </a>
      </td>
    </ng-container>

    <ng-container matColumnDef="auth_asym_id">
      <th mat-header-cell *matHeaderCellDef>AUTH ASYM ID</th>
      <td mat-cell *matCellDef="let item">{{ item.auth_asym_id || '-' }}</td>
    </ng-container>

    <ng-container matColumnDef="struct_asym_id">
      <th mat-header-cell *matHeaderCellDef>STRUCT ASYM ID</th>
      <td mat-cell *matCellDef="let item">{{ item.struct_asym_id || '-' }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; let odd = odd; columns: displayedColumns" [ngClass]="{ odd_row: odd }"></tr>
  </table>
</section>
