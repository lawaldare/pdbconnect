      (function () {
        var path = window.location.pathname;
        var base = path.split('/assets/')[0] + '/';
        window.__app_public_path__ = base;

        // Ensure <base> tag exists and points to assets/adv-search/

    <script>
      (function () {
        var publicPath = window.__app_public_path__ || '/';
        var scripts = [

          'assets/adv-search/polyfills.v3.2.1.bundle.js',
          'assets/adv-search/scripts.v3.2.1.bundle.js',
          'assets/adv-search/main.v3.2.1.bundle.js',

        scripts.forEach(function (src) {
          var s = document.createElement('script');
          s.src = publicPath + src;
          document.body.appendChild(s);
        });

        var styles = ['assets/adv-search/styles.v3.2.1.bundle.css'];
        styles.forEach(function (href) {
          var l = document.createElement('link');
          l.rel = 'stylesheet';
          l.href = publicPath + href;
          document.head.appendChild(l);
        });
      })();
