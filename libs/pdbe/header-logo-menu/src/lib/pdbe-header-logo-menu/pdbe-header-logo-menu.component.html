<div class="pdbe-header-logo-menu-top" [ngStyle]="{ 'background-color': backgroundColor }">
  <div class="pdbe-header-logo-menu" [ngStyle]="{ 'background-color': backgroundColor }">
    <div class="pdbe-header-logo-menu-container">
      <div class="header-logo-img-title">
        <img [ngClass]="getHeaderLogoClass()" src="{{ headerLogoSrc }}" alt="" />
        <span id="header-title" class="heading-1"> {{ headerTitle }}</span>
      </div>
      <div class="pdbe-header-logo-menu-icons">
        <i class="icon icon-common icon-bars" [ngClass]="getCollapsedClass(false)" (click)="invertCollapseState()" style="width: 32px; height: 32px"></i>
        <i class="icon icon-common icon-close" [ngClass]="getCollapsedClass(true)" (click)="invertCollapseState()" style="width: 24px; height: 24px"></i>
      </div>
      <ng-container *ngTemplateOutlet="pdbeHeaderLogoLinks; context: { forMobile: false }"></ng-container>
    </div>
    <ng-container *ngTemplateOutlet="pdbeHeaderLogoLinks; context: { forMobile: true }"></ng-container>
  </div>
</div>
<ng-template #pdbeHeaderLogoLinks let-node="forMobile">
  <div class="pdbe-header-logo-menu-urls" [ngClass]="getCollapsedClass(true)">
    <div *ngFor="let url of urls" [ngClass]="{ 'hoverable-mobile-menu': node }" [ngStyle]="{ '--bg-color': menuHighlightColor }">
      <!-- <a class="pdbe-header-menu-link paragraph-2 paragraph-2-menu-link" href="{{ url.path }}" target="_blank">{{ url.name }}</a> -->
      <pdbc-pdbe-link-button [label]="url.name" [url]="url.path" [fontStyle]="'Paragraph 2 (19px)'" [fontColor]="'#FFFFFF'"> </pdbc-pdbe-link-button>
    </div>
  </div>
</ng-template>
