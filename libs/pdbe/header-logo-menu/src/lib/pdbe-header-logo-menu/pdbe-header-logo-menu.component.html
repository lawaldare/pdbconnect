<section [ngStyle]="{ 'background-color': headerConfig.backgroundColor }">
  <div class="container">
    <div class="header-logo">
      <img [ngClass]="getHeaderLogoClass" src="{{ headerLogoSrc }}" alt="logo" />
      <span class="header-title">{{ headerConfig.headerTitle }}</span>
    </div>
    <i class="icon icon-common icon-align-justify" (click)="showMobileMenu()"></i>
    <ul class="nav-links">
      @for(link of headerConfig.urls; track link.name){
      <li class="nav-link">
        <a [href]="link.path" target="_blank">{{ link.name }}</a>
      </li>
      }
    </ul>
  </div>
</section>
@if(isMobile()){
<section class="mobile-menu" [ngStyle]="{ 'background-color': headerConfig.backgroundColor }">
  <ul class="nav-links">
    @for(link of headerConfig.urls; track link.name){
    <li class="nav-link">
      <a [href]="link.path" target="_blank">{{ link.name }}</a>
    </li>
    }
  </ul>
</section>
}
