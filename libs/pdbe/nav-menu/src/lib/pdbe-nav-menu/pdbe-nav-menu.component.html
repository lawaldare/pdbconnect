@if (navSections.length > 0) {
<div class="nav-menu">
  @for (navSection of navSections; track navSection.sectionId; let i = $index) {
  <div
    [id]="navSection.sectionId + '_to_activate'"
    [ngClass]="[
      navSection.isSubSection ? 'nav-subsection' : 'nav-section',
      navSection.sectionId === currentlyActive || navSection.sectionId === clickedActive ? 'isactive' : ''
    ]"
  >
    <a
      rel="noopener"
      class="nav-atag paragraph-3 default-text-color"
      routerLink="."
      [fragment]="navSection.sectionId"
      [ngStyle]="{ '--nav-menu-highlight-color': highlightColor }"
      (click)="clickedScrollTo(navSection.sectionId)"
    >
      {{ navSection.sectionName }}
    </a>
  </div>
  }
</div>
}
