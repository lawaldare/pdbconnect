<button mat-button [matMenuTriggerFor]="menu" [style.background]="backgroundColor()" class="entry-dropdown-button">
  <span>{{ title() }}</span>
  <svg _ngcontent-ng-c3990784984="" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
    <path _ngcontent-ng-c3990784984="" d="M7 10.5L12 15.5L17 10.5H7Z" fill="black"></path>
  </svg>
</button>
<mat-menu #menu="matMenu">
  @for (option of options(); track option.url) { @if (option.downloadable) {
  <a (click)="googleAnalyticsService.logClickEvents('click', 'Download list', 'dowload_list_click', option.name)" mat-menu-item [href]="option.url" download
    >{{ option.name }}</a
  >
  } @else {
  <a (click)="googleAnalyticsService.logClickEvents('click', 'Download list', 'dowload_list_click', option.name)" mat-menu-item [href]="option.url" target="_blank"
    >{{ option.name }}</a
  >
  } }
</mat-menu>
