<div class="search-top-container" [ngStyle]="{'background-color': backgroundColor}">
  <div class="search-bar-btn-container">
      <input
      #searchBox
      autocomplete="off"
      placeholder="{{ placeholder }}"
      id="searchitem"
      class="vf-form__input pdbeAutoCompleteSearchBox"
      required=""
      spellcheck="false"
      data-ms-editor="true"
      (keyup)="search(searchBox.value)"
      (keyup.enter)="openSearch(searchBox.value)"
    />
    <pdbc-pdbe-button *ngIf="pdbeSearchButtonStyle"
      [backgroundColor]="pdbeSearchButtonStyle.backgroundColor"
      [fontColor]="pdbeSearchButtonStyle.fontColor"
      [borderColor]="pdbeSearchButtonStyle.borderColor"
      [shadowColor]="pdbeSearchButtonStyle.shadowColor"
      [label]="pdbeSearchButtonStyle.label"
      [paddingSize]="pdbeSearchButtonStyle.paddingSize"
      [mobileIconName]="pdbeSearchButtonStyle.mobileIconName"
    >
    </pdbc-pdbe-button>
  </div>
  <div class="search-examples-adv-container">
    <div class="search-examples-container" *ngIf="examples && examples.length > 0">
      <span class="paragraph-3" style="color: white;">Examples:</span>

    </div>
  </div>
</div>

<section>
  <form id="ebi_search" class="vf-form vf-form--search vf-form--search--responsive | vf-sidebar vf-sidebar--end">
    <div class="vf-sidebar__inner">
      <div class="vf-form__item search-query-container">
        <label class="vf-form__label vf-u-sr-only | vf-search__label" for="searchitem">Search</label>
        <input
          #searchBox
          autocomplete="off"
          placeholder="{{ placeholder }}"
          id="searchitem"
          class="search-query vf-form__input pdbeAutoCompleteSearchBox"
          required=""
          spellcheck="false"
          data-ms-editor="true"
          (keyup)="search(searchBox.value)"
          (keyup.enter)="openSearch(searchBox.value)"
        />
        <span *ngIf="beta" id="beta" class="cl-beta">BETA</span>
        <span class="search-clear-icon" title="Clear search" (click)="clearSearch()" *ngIf="showClearIcon">
          <svg style="width: 20px; height: 20px" viewBox="0 0 24 24">
            <path fill="#000" d="M19,6.41L17.59,5L12,10.59L6.41,5L5,6.41L10.59,12L5,17.59L6.41,19L12,13.41L17.59,19L19,17.59L13.41,12L19,6.41Z" />
          </svg>
        </span>
        <ul *ngIf="suggestions && suggestions.length > 0" class="vf-list | vf-form--search__results-list | vf-stack vf-stack--custom" aria-labelledby="searchitem">
          <li class="vf-list__item" role="option" *ngFor="let suggestion of suggestions; let i = index" (click)="selectSuggestion(i)">{{ suggestion }}</li>
        </ul>
      </div>
      <pdbc-pdbe-button *ngIf="pdbeSearchButtonStyle"
        [backgroundColor]="pdbeSearchButtonStyle.backgroundColor"
        [fontColor]="pdbeSearchButtonStyle.fontColor"
        [borderColor]="pdbeSearchButtonStyle.borderColor"
        [shadowColor]="pdbeSearchButtonStyle.shadowColor"
        [label]="pdbeSearchButtonStyle.label"
        [paddingSize]="pdbeSearchButtonStyle.paddingSize"
        [mobileIconName]="pdbeSearchButtonStyle.mobileIconName"
      >
      </pdbc-pdbe-button>
