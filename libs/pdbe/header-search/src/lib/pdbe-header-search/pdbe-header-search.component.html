<section [ngStyle]="{ 'background-color': headerSearchConfig.backgroundColor }">
  <div class="container">
    <form [formGroup]="form" (ngSubmit)="onSubmit(form)">
      <input type="text" class="input-field" formControlName="searchTerm" placeholder="Search in PDBe and PDBe-KB" />
      <button class="vf-button vf-button--search-{{ buttonTheme }}">Search</button>
      <button class="vf-button vf-button--search-{{ buttonTheme }} mobile">
        <i class="icon icon-common icon-search"></i>
      </button>
      @if(form.controls.searchTerm.value){
      <i class="icon icon-common icon-times"></i>
      }
    </form>
    <section>
      <div class="left">
        Examples: @for(example of headerSearchConfig.examples; track example.label){
        <a [ngClass]="chipBg" [routerLink]="example.url" (click)="googleAnalyticsService.logClickEvents('click', 'Id Examples', 'id_click', example.label)">{{
          example.label
        }}</a>
        }
      </div>
      <!-- //TODO:To be implemented later! -->
      <!-- <div class="right">Advanced search</div> -->
    </section>
  </div>
</section>
