<!-- when linking to external links we use href and target -->
<a
  *ngIf="externalLink && url"
  class="pdbe-link-button"
  [ngClass]="fontStyle"
  [attr.href]="url.length > 0 ? url : null"
  [attr.target]="url.length > 0 ? '_blank' : null"
  (click)="toEmitOnClick && toEmitOnClick.length > 0 ? clickedLinkButton() : null"
  [ngStyle]="{
    '--link-btn-color': fontColor,
    '--link-btn-hover': hoverColor,
    '--link-btn-visited': visitedColor,
    '--link-btn-has-focus': focusBorderColor ? '1px' : '0px',
    '--link-btn-focus': focusBorderColor,
    '--link-btn-active-weight': activeFontWeight,
    '--link-btn-white-space': whiteSpace
  }"
>
  <ng-container *ngTemplateOutlet="linkBtnTemplate"></ng-container>
</a>

<!-- when using anchor scrolling we use routerLink and fragment -->
<a
  *ngIf="!externalLink && url"
  class="pdbe-link-button"
  [ngClass]="fontStyle"
  routerLink="."
  [fragment]="url"
  (click)="toEmitOnClick && toEmitOnClick.length > 0 ? clickedLinkButton() : null"
  [ngStyle]="{
    '--link-btn-color': fontColor,
    '--link-btn-hover': hoverColor,
    '--link-btn-visited': visitedColor,
    '--link-btn-has-focus': focusBorderColor ? '1px' : '0px',
    '--link-btn-focus': focusBorderColor,
    '--link-btn-active-weight': activeFontWeight,
    '--link-btn-white-space': whiteSpace
  }"
>
  <ng-container *ngTemplateOutlet="linkBtnTemplate"></ng-container>
</a>

<!-- when using this as a button only component -->
<a
  *ngIf="!url"
  class="pdbe-link-button"
  [ngClass]="fontStyle"
  (click)="toEmitOnClick && toEmitOnClick.length > 0 ? clickedLinkButton() : null"
  [ngStyle]="{
    '--link-btn-color': fontColor,
    '--link-btn-hover': hoverColor,
    '--link-btn-visited': visitedColor,
    '--link-btn-has-focus': focusBorderColor ? '1px' : '0px',
    '--link-btn-focus': focusBorderColor,
    '--link-btn-active-weight': activeFontWeight,
    '--link-btn-white-space': whiteSpace
  }"
>
  <ng-container *ngTemplateOutlet="linkBtnTemplate"></ng-container>
</a>

<!-- common template for content inside link as suggested in https://github.com/angular/angular/issues/24567 -->
<ng-template #linkBtnTemplate>
  {{ label }}
  <i class="icon icon-common icon-link-btn" [ngClass]="mobileIconName !== 'none' ? 'icon-' + mobileIconName : ''"></i>
</ng-template>
