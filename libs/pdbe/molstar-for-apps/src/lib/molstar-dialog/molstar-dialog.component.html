<section>
  <div>
    <mat-form-field>
      <mat-label>Select Conformer</mat-label>
      <mat-select [formControl]="selectedConformerControl()" (selectionChange)="onConformerChange($event)">
        @for (option of selections; track option) {
        <mat-option [value]="option.value">{{ option.viewValue }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
    @if(showFragmentOptions()){
    <mat-form-field>
      <mat-label>Select Scaffold/Fragment</mat-label>
      <mat-select [formControl]="selectedFragmentControl()" (selectionChange)="onFragmentChange($event)">
        @for (option of fragments(); track option) {
        <mat-option [value]="option">{{ option.name | customCase }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
    }
  </div>
  <i class="icon icon-common icon-window-close" (click)="dialogRef.close()"></i>
</section>
<div class="container" #viewContainer></div>
<section class="caption">
  <p>{{ caption() }}</p>
</section>
