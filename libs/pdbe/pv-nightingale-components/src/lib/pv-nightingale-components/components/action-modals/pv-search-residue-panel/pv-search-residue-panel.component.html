<div
  class="search-residue-panel"
  [ngStyle]="{
    top: panelPosition.top + 'px',
    left: panelPosition.left + 'px'
  }"
>
  <button class="close-btn" (click)="closePanel()">✖</button>

  <label>Select a residue range to highlight it on plot</label>

  <div class="range-select">
    <label>Select start residue:</label>
    <input
      type="text"
      [(ngModel)]="startInput"
      (input)="onStartInputChange()"
      (focus)="onStartInputFocus()"
      (blur)="onStartInputBlur()"
      placeholder="e.g. ALA 1"
      [attr.disabled]="false"
    />
    <ul *ngIf="filteredStartOptions.length > 0" class="autocomplete-list">
      <li *ngFor="let i of filteredStartOptions" (click)="selectStart(i)">{{ i.label }}</li>
    </ul>

    <label>Select end residue:</label>
    <input type="text" [(ngModel)]="endInput" (input)="onEndInputChange()" placeholder="Optional" [disabled]="startIdx === null" />
    <ul *ngIf="filteredEndOptions.length > 0" class="autocomplete-list">
      <li *ngFor="let i of filteredEndOptions" (click)="selectEnd(i)">{{ i.label }}</li>
    </ul>

    <button class="add-btn" (click)="addSelectedRange()" [disabled]="startIdx === null">Create new selection</button>
  </div>

  <div class="selected-residues" *ngIf="selectedResidues.length > 0">
    <label>Selected residues</label>
    <div class="residue-grid">
      <div class="residue-item" *ngFor="let residue of selectedResidues">
        <div *ngFor="let line of residue.split('|')">{{ line }}</div>
        <button class="remove-btn" (click)="removeSelected(residue)">✕</button>
      </div>
    </div>
  </div>
</div>
