        <defs>
          <clipPath id="clip0_2018_25241">
            <rect width="16" height="16" fill="white" />

        </defs>
      </svg>
    </div>
    <div class="dialog-body">
      @for(item of customTracks; track item.id; let i = $index){

      <div class="tracks-list">
        <div class="text-field">
          <input
            class="vf-form__input input-text"
            type="text"
            name="trackName_{{item.id}}"
            value="{{item.name}}"
            [ngClass]="{ 'input-error': trackNameErrors[i] !== undefined }"
            [(ngModel)]="trackNames[i]"
            (input)="onTrackNameInput(i)"
            placeholder="Track 1"
          />
          <p *ngIf="trackNameErrors[i] !== undefined" class="error-message">{{ trackNameErrors[i] }}</p>
        </div>
        <div class="text-field">
          <input
            class="vf-form__input input-text"
            type="text"
            name="residueRanges_{{item.id}}"
            value="{{item.rawData.residueRanges}}"
            [ngClass]="{ 'input-error': residueRangesErrors[i].length > 0 }"
            [(ngModel)]="residueRanges[i]"
            (input)="onResidueRangesInput(i)"
            [placeholder]="item.rawData.residueRanges"
          />
          <p *ngIf="residueRangesErrors[i].length > 0" class="error-message">{{ residueRangesErrors[i][0] }}</p>
        </div>

        <a class="delete-link" (click)="deleteTrack(item.id)">
          <span class="delete">Delete</span>
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
            <path
              d="M7 21C6.45 21 5.97933 20.8043 5.588 20.413C5.19667 20.0217 5.00067 19.5507 5 19V6H4V4H9V3H15V4H20V6H19V19C19 19.55 18.8043 20.021 18.413 20.413C18.0217 20.805 17.5507 21.0007 17 21H7ZM17 6H7V19H17V6ZM9 17H11V8H9V17ZM13 17H15V8H13V17Z"
              fill="#3B6FB6"
            />
          </svg>
        </a>
      </div>
      }

      <div class="we-do-not">We do not store this data. This data is kept only in the browser and will be deleted when you close the tab.</div>
    </div>
    <div class="dialog-footer">
      <div class="button-wrapper" id="frameContainer">
        <button class="delete cancle-link" (click)="onClose()">Cancel changes</button>
        <button class="button-primary vf-button vf-button--primary vf-button--sm" (click)="editTrack()">Save Changes</button>
      </div>
    </div>
  </div>
</div>
